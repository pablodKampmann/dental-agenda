name: CI

on:
  pull_request:
        branches: [dev, main, odontograma-dev]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # actualizado de v3 a v4

      - uses: actions/setup-node@v4
        # actualizado de v3 a v4
        with:
          node-version: 20
          cache: 'npm'               # ← cachea node_modules entre runs

      - run: npm ci --legacy-peer-deps

      - run: npm run build
        env:
          # inyectamos los secrets de GitHub como variables de entorno para el build
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_DATABASE_URL: ${{ secrets.NEXT_PUBLIC_FIREBASE_DATABASE_URL }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID }}

      # Los tests son un gate igual que el build: si esto esta en rojo, el PR no entra.
      # Ahi viven los guards del odontograma (que nadie decida un color de hallazgo por su
      # cuenta y que nadie escriba una cara a mano), que sin este paso no verificaban nada.
      #
      # Sin bloque `env:` a proposito, y verificado corriendo la suite completa con
      # `.env.local` fuera del arbol: los 213 tests pasan. Los cinco que tocan Firebase
      # mockean `@/lib/firebase` con `vi.mock`, asi que el modulo real —el unico que lee
      # esas variables— nunca se evalua. Si algun dia un test importa el modulo de verdad,
      # va a fallar con "Can't determine Firebase Database URL" y ahi si hay que replicar
      # el bloque de arriba.
      - run: npm run test:run
